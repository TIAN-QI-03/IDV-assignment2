<section>
  <h2>Image 013 -- Box Plot</h2>
  <svg width="1200" height="600" xmlns="http://www.w3.org/2000/svg">

    <line x1="80" y1="520" x2="80" y2="535" stroke="black" stroke-width="2"/>

    <line x1="440" y1="520" x2="440" y2="535" stroke="black" stroke-width="2"/>
    <text x="560" y="560">0</text>
    <line x1="560" y1="520" x2="560" y2="535" stroke="black" stroke-width="2"/>
    <text x="680" y="560">1</text>
    <line x1="680" y1="520" x2="680" y2="535" stroke="black" stroke-width="2"/>
    <text x="800" y="560">2</text>
    <line x1="800" y1="520" x2="800" y2="535" stroke="black" stroke-width="2"/>
    <text x="920" y="560">3</text>
    <line x1="920" y1="520" x2="920" y2="535" stroke="black" stroke-width="2"/>
    <text x="1040" y="560">4</text>
    <line x1="1040" y1="520" x2="1040" y2="535" stroke="black" stroke-width="2"/>
  </g>

  <!-- 蓝色线 -->
  <line x1="200" y1="300" x2="440" y2="300" stroke="#6688ee" stroke-width="3"/>
  <line x1="680" y1="300" x2="920" y2="300" stroke="#6688ee" stroke-width="3"/>
  <!-- 须端点竖线 -->
  <line x1="200" y1="240" x2="200" y2="360" stroke="black" stroke-width="3"/>
  <line x1="920" y1="240" x2="920" y2="360" stroke="black" stroke-width="3"/>

  <!-- 红色矩形 -->
  <rect x="440" y="220" width="240" height="160" fill="salmon" stroke="black" stroke-width="3"/>
  <!-- 黄色中位数线 -->
  <line x1="560" y1="221" x2="560" y2="379" stroke="yellow" stroke-width="4"/>

  <!-- 绿色圆 -->

  <circle cx="940" cy="300" r="10" fill="#77bb77"/>
  <circle cx="965" cy="300" r="10" fill="#77bb77"/>

  <path d="M 440 180 Q 560 160 680 180" fill="none" stroke="black" stroke-width="2"/>
  <text x="560" y="120" font-size="35" text-anchor="middle">Interquartile Range</text>
  <text x="560" y="160" font-size="24" text-anchor="middle">(IQR)</text>

    <text x="180" y="220">Outliers</text>
    <path d="M 180 230 L 180 270" stroke="black" stroke-width="2"/>

    <path d="M 940 230 L 940 270" stroke="black" stroke-width="2"/>

    <text x="200" y="400">"Minimum"</text>

    <text x="920" y="400">"Maximum"</text>
    <text x="920" y="430">(Q3 + 1.5*IQR)</text>

    <text x="440" y="415">Q1</text>
    <text x="560" y="410">Median</text>
    <text x="680" y="415">Q3</text>
